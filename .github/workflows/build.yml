name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (VST3 + AU, universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Unit tests
        run: ./build/RecklessDJFXTests_artefacts/Release/RecklessDJFXTests

      - name: Install plug-ins for validation
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/VST3 ~/Library/Audio/Plug-Ins/Components
          cp -R "build/RecklessDJFX_artefacts/Release/VST3/Reckless DJ FX.vst3" ~/Library/Audio/Plug-Ins/VST3/
          cp -R "build/RecklessDJFX_artefacts/Release/AU/Reckless DJ FX.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true

      - name: auval
        run: auval -strict -v aufx Rdfx Rckl

      - name: pluginval (VST3)
        run: |
          curl -sL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process --skip-gui-tests \
            --validate ~/Library/Audio/Plug-Ins/VST3/"Reckless DJ FX.vst3"

      - name: Package
        run: |
          mkdir -p dist
          cd build/RecklessDJFX_artefacts/Release
          ditto -c -k --keepParent "VST3/Reckless DJ FX.vst3" "$GITHUB_WORKSPACE/dist/Reckless-DJ-FX-macOS-VST3.zip"
          ditto -c -k --keepParent "AU/Reckless DJ FX.component" "$GITHUB_WORKSPACE/dist/Reckless-DJ-FX-macOS-AU.zip"
          ditto -c -k --keepParent "Standalone/Reckless DJ FX.app" "$GITHUB_WORKSPACE/dist/Reckless-DJ-FX-macOS-Standalone.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Reckless-DJ-FX-macOS
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  windows:
    name: Windows (VST3)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        run: build\RecklessDJFXTests_artefacts\Release\RecklessDJFXTests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/RecklessDJFX_artefacts/Release/VST3/Reckless DJ FX.vst3" -DestinationPath dist/Reckless-DJ-FX-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Reckless-DJ-FX-Windows
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
